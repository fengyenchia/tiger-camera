<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <style>
    .sheet { fill:#fffdf7; }
    .part { fill:#f5ead7; stroke:#4b4038; stroke-width:3; }
    .cut { fill:#fffdf7; stroke:#d94b43; stroke-width:3; }
    .screen { fill:#2d343b; stroke:#4b4038; stroke-width:3; }
    .dim { stroke:#6b5e55; stroke-width:2; fill:none; }
    .guide { stroke:#b7a89c; stroke-width:1.5; stroke-dasharray:5 5; }
    .label { font-family:Arial, 'Noto Sans TC', sans-serif; fill:#372f2b; font-size:20px; }
    .note { font-family:Arial, 'Noto Sans TC', sans-serif; fill:#6b5e55; font-size:16px; }
    .title { font-family:Arial, 'Noto Sans TC', sans-serif; fill:#372f2b; font-size:28px; font-weight:bold; }
  </style>
  <rect class="sheet" width="1200" height="780"/>
  <text class="title" x="50" y="55">Tiger Camera — E0 定位原型外觀配置（示意，非最終孔位圖）</text>
  <text class="note" x="50" y="85">外徑 90 × 105 × 50 mm；壁厚 2.5 mm。孔中心位置以 Onshape 草圖為準。</text>

  <!-- Front -->
  <text class="label" x="135" y="140">前面：鏡頭朝外</text>
  <rect class="part" x="120" y="165" width="180" height="250" rx="16"/>
  <circle class="cut" cx="210" cy="270" r="9"/>
  <line class="guide" x1="210" y1="165" x2="210" y2="415"/>
  <text class="note" x="225" y="276">鏡頭孔 Ø9.0</text>
  <line class="dim" x1="120" y1="440" x2="300" y2="440"/>
  <line class="dim" x1="120" y1="432" x2="120" y2="448"/><line class="dim" x1="300" y1="432" x2="300" y2="448"/>
  <text class="note" x="185" y="466">90 mm</text>
  <line class="dim" x1="95" y1="165" x2="95" y2="415"/>
  <line class="dim" x1="87" y1="165" x2="103" y2="165"/><line class="dim" x1="87" y1="415" x2="103" y2="415"/>
  <text class="note" x="48" y="300" transform="rotate(-90 48 300)">105 mm</text>

  <!-- Rear -->
  <text class="label" x="478" y="140">背面：螢幕朝使用者</text>
  <rect class="part" x="470" y="165" width="180" height="250" rx="16"/>
  <rect class="screen" x="530" y="225" width="60" height="60" rx="5"/>
  <text class="note" x="505" y="312">ST7735 螢幕開孔</text>
  <text class="note" x="493" y="342">後蓋可拆開查看 TP4056 指示燈</text>

  <!-- Right -->
  <text class="label" x="807" y="140">右側：開關＋充電孔</text>
  <rect class="part" x="820" y="165" width="100" height="250" rx="16"/>
  <rect class="cut" x="838" y="225" width="64" height="36" rx="4"/>
  <text class="note" x="930" y="249">KCD1-11 11 × 16</text>
  <rect class="cut" x="884" y="229" width="13" height="28" rx="6"/>
  <text class="note" x="930" y="280">TP4056 USB-C 3 × 7.5</text>
  <text class="note" x="930" y="302">緊鄰開關，直式放置</text>
  <text class="note" x="830" y="382">不設 LED 觀察孔</text>
  <line class="dim" x1="950" y1="165" x2="950" y2="415"/>
  <line class="dim" x1="942" y1="165" x2="958" y2="165"/><line class="dim" x1="942" y1="415" x2="958" y2="415"/>
  <text class="note" x="976" y="300" transform="rotate(-90 976 300)">105 mm</text>

  <!-- Top and bottom -->
  <text class="label" x="140" y="535">頂面</text>
  <rect class="part" x="120" y="555" width="180" height="70" rx="12"/>
  <circle class="cut" cx="168" cy="590" r="12"/>
  <text class="note" x="195" y="596">快門 Ø12，偏左</text>

  <text class="label" x="480" y="535">底面</text>
  <rect class="part" x="470" y="555" width="180" height="100" rx="12"/>
  <line class="guide" x1="470" y1="570" x2="650" y2="570"/>
  <text class="note" x="475" y="550">完整底面（無 USB 開孔）</text>
  <text class="note" x="485" y="680">ESP32 USB-C：拆後蓋維修</text>

  <!-- depth -->
  <text class="label" x="820" y="535">厚度</text>
  <rect class="part" x="820" y="562" width="100" height="60" rx="10"/>
  <line class="dim" x1="820" y1="660" x2="920" y2="660"/>
  <line class="dim" x1="820" y1="652" x2="820" y2="668"/><line class="dim" x1="920" y1="652" x2="920" y2="668"/>
  <text class="note" x="848" y="688">50 mm</text>

  <text class="note" x="50" y="740">定位原型目標：先確認元件可裝入、孔位可操作、後蓋可閉合；螺絲柱、熱熔螺母與最終孔中心均留待下一版。</text>
</svg>
